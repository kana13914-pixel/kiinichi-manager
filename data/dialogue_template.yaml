pattern_check:
  description: ホームを開いたときの時間帯の一言の代わりに、記録のくせに合わせて出す一言。同じ食事の記録なしが3日続いたら（その日1回だけ）。内部の記録（db.stats）から決める（確定。D-060 ⑩、H-022 ③、D-065） 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
