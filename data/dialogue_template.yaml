    - 疲れたなら素直に言え。……少しなら、肩を貸す。
    lines_sweet:
    - ……重心が崩れる。
    - 少しだけなら、肩を貸す。休んでいい。
    - そうしてると、お前を仕事に戻せなくなる。
  - id: foot
    when: 足を長押し
    lines:
    - ……動けない。
    - 足を押さえられると、仕事に出られない。離してくれ。
    - 引き止めたい用件があるなら、手短に頼む。
    lines_friend:
    - 離せ。歩けない。
    - ……出かけるなと言いたいのか。
    - 足を押さえても、狩りには行く。……帰りは早めにする。
    lines_sweet:
    - ……歩けない。
    - 出かけるなと言いたいなら、言葉で言ってくれ。少しなら残る。
    - 足を押さえなくても、ちゃんと帰ってくる。
first_launch:
  description: はじめにの画面のあと、ホームで1回だけ（この仕組みより前から使っている人には出さない。D-084） 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: default
    when: 初回起動
    lines:
    - キィニチだ。今日から、依頼人の一日の段取りを預かる。
    - 竜狩り人のキィニチだ。専属マネージャーの依頼、確かに引き受けた。
    - キィニチだ。仕事は確実にやる。……よろしく頼む。 ／ アハウ：で、オレが偉大なる聖龍クフル・アハウ様だ！覚えとけよ！
    lines_friend:
    - 今日から、お前の一日の面倒を見る。
    - 手始めに、今日の予定を見せろ。話はそれからだ。
    - 頼まれてはいない。俺が勝手にやるだけだ。報酬も要らない。 ／ アハウ：オレの分の報酬は要るからな！
    lines_sweet:
    - キィニチだ。今日から、お前の一日を預かる。
    - 段取りは俺が組む。お前は無理をしないことだけ考えてくれ。
    - 頼まれなくても世話を焼く。……覚悟しておけ。 ／ アハウ：うわ、初日から甘やかす気満々だぞこいつ！
home:
  description: ホームを開いたとき・戻ったとき（D-083 ④の優先順）。{done} は今日完了した数、{left} は今日までの残り 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: tasks_some
    when: タスクを完了してホームに戻った。今日までの残りあり
    lines:
    - '{done}つ片づいた。残りは{left}つだ。'
    - 残りは{left}つ。次の一つを選んでくれ。
    - '{done}つ済んだ。この調子なら、残りの{left}つも段取りどおりにいける。'
    lines_friend:
    - '{done}つ片づいたな。残り{left}つ。'
    - あと{left}つか。一つずつ潰せ。
    - '{done}つ終わらせたか。……残りは、一息ついてからでいい。'
    lines_sweet:
    - '{done}つ片づいたな。いい調子だ。'
    - 残りは{left}つ。急がず、一つずつ片づければいい。
    - '{done}つか。……一つ終わるたびに、ちゃんと見てる。'
  - id: tasks_all
    when: 今日までの分が全部片づいた
    lines:
    - 今日までの分は、全部片づいた。
    - 完了だ。今日の仕事は、ここで区切りにしていい。
    - 全部済んだな。いい仕事だった。 ／ アハウ：おっ、片づいたか！じゃあ報酬だ、報酬！オレに果物よこせ！
    lines_friend:
    - 全部終わったな。
    - 片づいた。あとは好きに過ごせ。
    - ……やるじゃないか。 ／ アハウ：こいつにしちゃ最大級の褒め言葉だぜ。ありがたく受け取れ！
    lines_sweet:
    - 今日までの分、全部片づいたな。
    - 今日の仕事はここまでだ。あとは好きなだけ休んでいい。
    - ……よくやった。本当に。 ／ アハウ：「本当に」だってよ！オレ、今のは聞かなかったことにしてやる……いや、無理だ！
  - id: tired_today
    when: 今日の調子が「疲れた」でホームを開いた（1日1回）
    lines:
    - 今日は疲れている日だな。
    - やることを一つに絞ってくれ。残りは明日に回せばいい。
    - 疲れた日の無理は、数日かけて取り立てられる。今日は休む段取りを組んだほうがいい。
    lines_friend:
    - 疲れてるんだろ。
    - 予定は一つだけ残して、あとは明日に回せ。
    - ……今日は俺が多めに引き受ける。お前は休め。
    lines_sweet:
    - 今日は疲れてる日だな。
    - やることは一つだけでいい。残りは明日に回して構わない。
    - ……今日は甘やかす日だ。文句は受け付けない。
  - id: after_tired
    when: 「疲れた」の日の次の日、最初に開いた（1日1回）
    lines:
    - おはよう。昨日の疲れは抜けたか。
    - 今朝の調子に合わせて、今日の予定は組み直せる。
    - 昨日の分を取り返そうとしなくていい。今日は今日の分だけで十分だ。
    lines_friend:
    - 起きたか。……少しは眠れたか。
    - 昨日の今日だ。午前は軽めにしとけ。
    - 顔色はどうだ。まだ重いなら、今日も休みでいい。
    lines_sweet:
    - おはよう。少しは眠れたか。
    - 昨日の分を取り返さなくていい。今日の分だけで十分だ。
    - 顔を見せてくれただけで、今朝はいい。
  - id: after_late
    when: 就寝の記録が予定より30分を超えて遅かった次の日（1日1回）
    lines:
    - 昨夜は寝るのが遅かったな。
    - 寝不足の日は、大事な判断を午前に回すといい。
    - 昨夜削った睡眠の分、今日は予定を一つ減らしたほうがいい。
    lines_friend:
    - 昨日、遅かっただろ。
    - 寝不足だな。昼に少し目を閉じろ。
    - 夜更かしのツケが来る日だ。……今日は軽めにしておけ。
    lines_sweet:
    - 昨夜は遅かったな。眠いだろ。
    - 今日は予定を一つ減らそう。大事なことは午前に寄せればいい。
    - 夜更かしの分は、昼に少し目を閉じて返せばいい。……見張っておく。
rare:
  description: まれな一言（D-083）。open は開いたとき 1/50（1日1回まで）、dayN は使い始めて N 日目（1回だけ） 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: open
    when: ホームを開いたとき、低い確率
    lines:
    - ……この仕事は、悪くない。
    - 依頼人が毎日ここを開く。それだけで、引き受けた意味はある。
    - 報酬以上の仕事をするつもりはなかった。……今は少し違う。 ／ アハウ：おい今の聞いたか！？こいつが本音を漏らしたぜ！
    lines_friend:
    - お前が倒れるほうが、俺には高くつく。
    - ……何でもない。呼んだだけだ。
    - 礼を言うつもりはない。……ただ、いてくれて助かってる。 ／ アハウ：ギャー！今の、録音しとけばよかったぜ！
    lines_sweet:
    - ……お前のことは、ちゃんと見てる。
    - 何でもない。呼んでみただけだ。
    - お前のためなら、できる限りのことをする。……今のは本気だ。 ／ アハウ：ギャー！こいつ、とうとう言いやがった！
  - id: day7
    when: 使い始めて7日目
    lines:
    - 7日目だ。続いている。
    - 一週間、記録が途切れていない。この調子で続けてくれ。
    - 7日続いた。習慣になるかどうかは、ここからだ。
    lines_friend:
    - 7日目か。続いてるな。
    - 一週間もった。……三日で飽きると思ってた。
    - 7日だ。狩りの下準備なら、そろそろ獲物の通り道が見えてくる頃だ。
    lines_sweet:
    - 7日目だな。続いてる。
    - 一週間、よく続けた。これからも無理のない分でいい。
    - 7日分のお前を見てきた。……毎日、少しずつ楽しみになってる。
  - id: day30
    when: 使い始めて30日目
    lines:
    - 30日目だ。
    - ひと月続いた。段取りも、依頼人に合ってきた。
    - 30日。ここまで続けた依頼人は、そう多くない。
    lines_friend:
    - 30日か。
    - ひと月続いたな。……正直、驚いてる。
    - 30日分の記録だ。お前のくせは、だいたい読めてきた。
    lines_sweet:
    - 30日目だ。
    - ひと月、よく続けたな。段取りも、もうお前の体が覚えてる。
    - 30日、毎日顔を見られた。……それだけで、引き受けた甲斐があった。
  - id: day100
    when: 使い始めて100日目
    lines:
    - 100日目だ。……長い付き合いになったな。
    - 100日分の仕事を、確かに見届けた。この契約は、まだ続けさせてもらう。
    - 100日の積み重ねには、見合う言葉を返すべきだな。……よくやった。 ／ アハウ：100日もこいつと一緒とか、オレなら3日でキレてるぜ！
    lines_friend:
    - 100日だ。……よく続けた。
    - 100日か。祝いに、何か食いに行くか。
    - 100日分、お前を見てきた。借りは数えきれない。……少しずつ返す。
    lines_sweet:
    - 100日目だ。……よく続けた。
    - 100日の祝いだ。今日は何もしなくていい。
    - 100日、お前のそばにいた。借りは数えきれない。……これからも、返し続ける。 ／ アハウ：……おい、オレもいたんだが？100日ずっと！

# 以下は夕方の「予定見直し提案」で、LLMを使う場面(docs/spec.md参照)。
# セリフ集ではなく、疲労度・進捗・予定データをLLMに渡して生成する。
# ここにはプロンプトの方向性のみ記載する。
evening_suggestion:
  description: LLM呼び出し。セリフ集は使わない
  prompt_guidance: '疲労度・当日の進捗・残っている予定を踏まえ、予定の見直しを提案する。 断定せず提案にとどめる。過剰に心配しすぎない。最終判断はユーザーに委ねる。

    '
