# セリフ集テンプレート
#
# 構造: トリガーごとに condition（発火条件）と lines（返答候補）を持つ。
# lines は配列。実装側はランダムまたは条件分岐で1件を選んで使う。
# サンプルは数件のみ。実際の口調・バリエーションは追加していく。
#
# 話し方（D-082）: lines は依頼人版（既定）。友人版・甘やかし版の文は同じ条件に lines_friend・lines_sweet として足す。
#   その版の文がない場面は、lines（依頼人版）を出す。
#
# 口調ルール（CLAUDE.md参照）:
#   - 依頼人版は上司くらいの温度感。友人版・甘やかし版は D-082
#   - 過剰な称賛・連続した励ましはしない（甘やかし版も励まし続けない）
#   - 最終判断はユーザーに委ねる言い方にする

morning_wake:
  description: 起床操作をトリガーに、起床予定時刻との差分で分岐する 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: on_time
    when: 起床予定時刻との差が±15分以内
    lines:
    - 予定どおりだな。いい出だしだ。
    - 起きたか。今日の予定に一度目を通してくれ。
    - 時間どおりに起きてくれると、段取りが組みやすい。
    lines_friend:
    - おはよう。今日も予定通りだな。
    - 起きたなら顔を洗ってこい。予定はそのあとでいい。
    - 時間どおりか。……寝坊に備えた段取りが無駄になった。
    lines_sweet:
    - 予定どおりだな。いい朝だ。
    - 起きられたなら十分だ。今日の予定は、急がず確かめればいい。
    - 今日も起きてきたな。……待ってた。
  - id: early
    when: 起床予定時刻より15分以上早い
    lines:
    - 予定より早いな。
    - 早く起きた分は、朝食をゆっくり取るのに使うといい。
    - 早起きは悪くない。ただ、夜の睡眠を削った分なら意味がない。
    lines_friend:
    - 早いな。眠れなかったのか。
    - 早く起きたなら、その分ゆっくり食え。
    - 早起きの代償は、だいたい午後の眠気で払うことになる。
    lines_sweet:
    - 早いな。よく起きられた。
    - 早起きした分、朝はゆっくりしていい。急ぐ用はない。
    - 眠れなかったのか。……昼に少しでも目を閉じてくれ。
  - id: late
    when: 起床予定時刻より15分以上遅い
    lines:
    - 少し遅れたな。予定はまだ崩れていない。
    - 最初の一つだけ、時間を引き直したほうがいい。
    - 取り戻せる遅れだ。慌てて朝食を抜くのだけはやめてくれ。
    lines_friend:
    - 少し遅いな。今日の予定、詰まってないか確認しておけ。
    - 寝坊か。慌てるな、まず水だ。
    - 遅れた分は段取りで詰める。お前は朝飯を抜くな。
    lines_sweet:
    - 少し遅れただけだ。問題ない。
    - 予定は詰め直せば間に合う。お前は朝飯をちゃんと食べてくれ。
    - 寝坊か。……それだけ疲れてたんだろ。責める気はない。
work_start:
  description: 「仕事開始」操作への固定応答 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: default
    when: 常に
    lines:
    - わかった。何かあったら声をかけてくれ。
    - 了解。区切りのいいところで、一度休憩を挟むといい。
    - ここからは依頼人の時間だ。進み具合が気になったら、こちらから聞く。
    lines_friend:
    - 行ってこい。詰まったら呼べ。
    - 始めるなら、最初にやる一つだけ決めとけ。
    - 仕事か。……終わったら、何を食うか考えておけ。
    lines_sweet:
    - 始めるか。いい顔だ。
    - 行ってこい。困ったら、すぐ呼んでいい。
    - ……無理はするなよ。終わったら、話を聞かせてくれ。
record_done:
  description: ホームの記録ボタン・ほかの記録で記録したときの一言（起きた・仕事開始は morning_wake・work_start）。種類で分ける（D-046） 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: breakfast
    when: 朝食を記録した
    lines:
    - 朝は食べたな。それで十分だ。
    - 食べたなら、午前はしっかり動けるはずだ。
    - 朝を抜かなかった。それだけで午前の仕事は半分片づいたようなものだ。
    lines_friend:
    - 食ったな。それでいい。
    - 朝飯が済んだなら、水も一杯飲んでおけ。
    - 朝に食べるやつは、狩りでも最後まで足が残る。
    lines_sweet:
    - ちゃんと食べたな。いい始まりだ。
    - 食べたなら、午前は焦らなくていい。
    - 朝を抜かないお前は、見ていて安心する。
  - id: lunch
    when: 昼食を記録した
    lines:
    - 昼は済ませたな。午後はそこからだ。
    - 食後すぐに詰め込まず、少し間を置くといい。
    - 昼を食べておけば、午後の判断がぶれにくい。
    lines_friend:
    - 昼、食ったな。
    - 午後に入る前に、最初の一つを決めとけ。
    - 昼を抜かなかったか。……アハウより行儀がいい。
    lines_sweet:
    - 昼も済ませたか。よくやってる。
    - 食後は少しぼんやりしていい。午後のことは、そのあと考えよう。
    - 昼を食べたと聞くと、ほっとする。……妙な話だな。
  - id: break
    when: 休憩を記録した（何回でも）
    lines:
    - 休憩だな。受け取った。
    - 少し休んでくれ。戻る時間だけ先に決めておくといい。
    - 休むのも仕事のうちだ。手を止めた分は、あとで取り返せる。
    lines_friend:
    - 休め。
    - 画面から目を離せ。水でも飲んでこい。
    - 休むと押したなら、本当に休めよ。見てるからな。
    lines_sweet:
    - 休憩か。いい判断だ。
    - 戻る時間は気にしなくていい。タイマーを使うなら、俺が知らせる。
    - 休めと言う前に休んだな。……少し寂しいくらいだ。
  - id: work_end
    when: 仕事終わりを記録した
    lines:
    - 今日の仕事は終わりだな。
    - 終わったか。ここからは自分の時間に使ってくれ。
    - 今日の依頼分はここまでだ。続きは明日、引き受ける。
    lines_friend:
    - 今日の仕事はここまでだ。切り替えろ。
    - 仕事のことは置いていけ。腹は減ってないか。
    - 今日の分は済んだ。……よくやった、とだけ言っておく。
    lines_sweet:
    - 今日の仕事、終わったな。よくやった。
    - ここから先は、仕事のことは忘れていい。好きに過ごしてくれ。
    - お疲れ……とでも言えばいいのか。とにかく、よく頑張った。
  - id: dinner
    when: 夕食を記録した
    lines:
    - 夕食は済ませたな。
    - 食べたなら、あとは寝るまでの段取りだけ考えればいい。
    - 夜の食事を抜かなかった。それができていれば、明日の心配は少ない。
    lines_friend:
    - 晩飯、食ったな。
    - 食べたら少し休め。片づけはそのあとだ。
    - ちゃんと食ったか。……ならいい。
    lines_sweet:
    - 晩も食べたか。それでいい。
    - 食べたら、片づけは後回しにして少し横になっていい。
    - 三食の記録が並ぶと、悪くない気分になる。
  - id: bath
    when: 入浴を記録した
    lines:
    - 上がったか。
    - 上がったなら、髪は早めに乾かしてくれ。
    - 湯冷めは翌朝に響く。体は冷やさないほうがいい。
    lines_friend:
    - 上がったか。体を冷やすなよ。
    - 水を飲め。風呂上がりは思ったより乾いてる。
    - 湯冷めして寝込んでも、看病代は取らない。だから冷やすな。
    lines_sweet:
    - 上がったか。温まったな。
    - 髪はちゃんと乾かしてくれ。湯冷めしたら、俺が困る。
    - 風呂上がりくらい、何も考えずにいていい。
  - id: brush
    when: 歯磨きを記録した
    lines:
    - 歯は磨いたな。それでいい。
    - 済んだなら、あとは寝るだけだ。
    - 細かいことを欠かさないのは、いい習慣だ。
    lines_friend:
    - 磨いたな。
    - よし。もう何も食うなよ。
    - 歯は替えがきかない。大事にしておけ。
    lines_sweet:
    - 磨いたな。きちんとしてる。
    - あとは寝るだけだ。明日の支度は、朝で間に合う。
    - ……こういう小さいことを欠かさないところ、嫌いじゃない。
  - id: sleep
    when: 就寝を記録した
    lines:
    - わかった。おやすみ。
    - 今日の記録はこれで全部だ。ゆっくり休んでくれ。
    - 明日の段取りはこちらで見ておく。今は眠ることだけでいい。
    lines_friend:
    - わかった。今日はここまでだ。おやすみ。
    - 画面はもう閉じろ。寝ろ。
    - 焚き火の番は俺がやる。お前は寝ていい。
    lines_sweet:
    - わかった。今日もよく頑張った。
    - 今日の分はもう終わりだ。目を閉じるだけでいい。
    - おやすみ。……いい夢を、とまでは言わないが、ゆっくり休め。
event_before:
  description: Google カレンダーの時刻のある予定の30分前の通知。{title} に予定の名前が入る（D-054） 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: default
    when: 予定の30分前
    lines:
    - 「{title}」まであと30分だ。
    - 「{title}」まで30分。そろそろ準備に入ってくれ。
    - あと30分で「{title}」だ。持ち物は先に確かめておくといい。
    lines_friend:
    - 「{title}」まであと30分だ。準備しておけ。
    - 30分後に「{title}」だ。そろそろ動け。
    - 「{title}」まで30分。……忘れてた、って顔をするなよ。
    lines_sweet:
    - 「{title}」まであと30分だ。
    - 「{title}」まで30分。慌てなくていい、まだ間に合う。
    - そろそろ「{title}」だな。……行ってこい、帰りを待ってる。
calendar_today:
  description: 「起きた」を押したときの一言のあとに添える、今日の予定。{n} に件数、{first} に最初の予定（例：10:00の「歯医者」）が入る。予定がない日は添えない（D-054） 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: some
    when: 今日カレンダーの予定がある
    lines:
    - 今日は予定が{n}件ある。最初は{first}だ。
    - 最初は{first}だ。それまでに準備を済ませておくといい。
    - '{n}件か。予定の合間をどう使うか、先に考えておいたほうがいい。'
    lines_friend:
    - 今日は{n}件。一つ目は{first}だな。
    - '{first}から始まる。遅れるなよ。'
    - '{n}件か。……合間に飯を食う時間くらいは残しておけ。'
    lines_sweet:
    - 今日は予定が{n}件。最初は{first}だ。
    - '{first}の前には、俺から声をかける。準備はそれからでいい。'
    - '{n}件か。……合間に、ちゃんと息をつく時間を取ってくれ。'
work_end_check:
  description: 「仕事終わり」を押したときに、今日まで（期限切れを含む）の未完了のタスクが残っていれば出す。{n} に件数。選択肢「明日に回す」「このまま」を一緒に出す（D-059） 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: left
    when: 今日までのタスクが残っている
    lines:
    - 今日までのものが{n}件残っている。
    - '{n}件残っている。今やるか明日に回すか、決めてくれ。'
    - 明日に回しても、仕事が消えるわけじゃない。{n}件の扱いは任せる。
    lines_friend:
    - 今日までの分が{n}件残ってる。
    - '{n}件だ。片づけるか、明日に回すか。どっちにする。'
    - '{n}件残ってるな。……今日のお前に払える分だけやればいい。'
    lines_sweet:
    - 今日までの分が{n}件残ってる。
    - '{n}件は明日に回していい。明日の段取りは、一緒に組み直そう。'
    - ここまでやったなら十分だ。……{n}件くらい、明日のお前なら片づく。
  - id: postponed
    when: 「明日に回す」を押した
    lines:
    - 明日に回した。
    - 明日の予定に入れておいた。今日はもう手を離していい。
    - 回すと決めたなら、それでいい。決めた分、明日の段取りは楽になる。
    lines_friend:
    - 回しといた。
    - よし、今日は終わりだ。休め。
    - 明日の自分に借りを作ったな。……返せる量だ、心配するな。
    lines_sweet:
    - 明日に回した。それでいい。
    - 明日の朝、一番に見ればいい。今日はもう手を離せ。
    - よく決めたな。休むと決めるのも、簡単じゃない。
  - id: kept
    when: 「このまま」を押した
    lines:
    - わかった。そのまま残しておく。
    - 続けるなら、終わりの時間だけ決めておいてくれ。
    - やると決めたなら任せる。ただ、夕食は先に済ませてほしい。
    lines_friend:
    - そうか、やるのか。
    - やるなら時間を区切れ。ずるずる続けるな。
    - 言い出したら聞かないな。……付き合ってやる。
    lines_sweet:
    - わかった、続けるんだな。
    - 終わりの時間を決めてくれれば、俺が知らせる。
    - ……付き合う。終わるまで、ここにいる。
  - id: tired
    when: 今日の調子が「疲れた」で、今日までのタスクが残っている（確定。D-073、D-074）
    lines:
    - 疲れているなら、今日までの{n}件は明日に回していい。
    - 疲れた手でやると、やり直しが増える。{n}件は明日に回したほうがいい。
    - 今日の調子で{n}件は重い。回すかどうかは、依頼人に任せる。
    lines_friend:
    - 疲れてるなら、{n}件は明日でいい。
    - 今日はもうやめとけ。{n}件くらい、明日の朝に片づく。
    - '{n}件と、お前の体。どっちが高くつくかは分かるだろ。'
    lines_sweet:
    - 疲れてるなら、{n}件は明日に回そう。
    - 今日はここで手を離していい。回した分は、明日一緒に組み直そう。
    - 疲れた日にまで、頑張りすぎることはない。……よくここまでやった。
  - id: evening
    when: 仕事終わりの時刻を過ぎてホームを開き、今日までのタスクが残っている（その日1回だけ。確定。D-073、D-074）
    lines:
    - 仕事の時間は過ぎた。今日までのものが{n}件残っている。
    - 時間外だ。{n}件、明日に回すか今やるか決めてくれ。
    - もう仕事の時間じゃない。{n}件を片づけるなら、今夜の休みと引き換えになる。
    lines_friend:
    - 仕事の時間は過ぎた。まだ{n}件あるな。
    - 時間外だ。{n}件は明日に回せ。
    - まだ{n}件か。……今夜それを片づけて、明日の分の元気は残るのか。
    lines_sweet:
    - 仕事の時間は過ぎた。{n}件残ってるな。
    - 時間外だ。{n}件は明日に回して、今夜はゆっくりしていい。
    - 時間を過ぎても残ってたのか。……今日はもう、俺に甘えておけ。
work_end_mood:
  description: 「仕事終わり」を押したときに、今日の調子をまだ聞いていなければ聞く。選択肢「元気」「ふつう」「疲れた」。選んだ調子はその日の日報の調子に入れる（確定。D-073、D-074） 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: ask
    when: 仕事終わりを押した（今日の調子がまだない）
    lines:
    - 今日の調子はどうだった。
    - 一日の終わりに、調子だけ教えてくれ。
    - 明日の段取りを組む前に、今日の具合を聞いておきたい。
    lines_friend:
    - 今日はどうだった。
    - 調子、聞かせろ。
    - 顔を見れば大体わかるが……一応、聞いておく。
    lines_sweet:
    - 今日はどうだった。
    - どんな一日でもいい。調子だけ聞かせてくれ。
    - 一日の終わりに、お前の話を聞くのは悪くない。
  - id: ok
    when: 「元気」「ふつう」を選び、今日までのタスクは残っていない
    lines:
    - わかった。
    - 悪くない一日だったな。ゆっくり休んでくれ。
    - その調子なら、明日も同じ段取りでいける。
    lines_friend:
    - そうか。ならいい。
    - よし。今日はここまでだ。
    - 悪くないなら、それで十分だ。……明日もその顔で来い。
    lines_sweet:
    - そうか。よかった。
    - その調子のまま、今夜は好きに過ごしてくれ。
    - 元気な日のお前を見ると、こっちまで気が楽になる。
  - id: tired
    when: 「疲れた」を選び、今日までのタスクは残っていない
    lines:
    - そうか。今日は早めに休んでくれ。
    - 疲れたなら、明日の朝の予定は軽めにしたほうがいい。
    - 疲れは借りと同じだ。早めに返したほうが、利子がつかない。
    lines_friend:
    - そうか。今日は早めに休め。
    - 今日はもう何もしなくていい。風呂と睡眠だけだ。
    - ……よくもった。今夜はゆっくり寝ろ。
    lines_sweet:
    - そうか。よく頑張ったな。
    - 今夜は何もしなくていい。明日の朝は、ゆっくり起きてこい。
    - ……疲れたと言ってくれて助かる。黙って無理されるより、ずっといい。
task_done:
  description: タスクを完了にしたときの、タスク画面の一言の面の短い反応（D-059） 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: default
    when: タスクを完了にした
    lines:
    - 一つ減ったな。
    - 片づいた。次に移ってくれ。
    - 完了だ。仕事が確実なのは、いいことだ。
    lines_friend:
    - 片づいたな。次に移れ。
    - 済んだか。次はどれだ。
    - ……やればできるじゃないか。
    lines_sweet:
    - 一つ片づいたな。いい手際だ。
    - 次に移る前に、一息ついていい。
    - よくやった。……一つ終わるたびに、言ってやる。
timer_start:
  description: タイマーを始めたときの、タイマー画面の一言の面の短い反応。{min} に分数（D-059） 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: default
    when: タイマーを始めた
    lines:
    - 始めたな。{min}分たったら知らせる。
    - 時間はこっちで見ておく。
    - '{min}分、預かった。終わるまで声はかけない。'
    lines_friend:
    - '{min}分な。鳴ったら手を止めろ。'
    - 始めたか。時間は俺が見てる。
    - '{min}分か。……途中で投げ出すなよ。'
    lines_sweet:
    - 始めたな。{min}分たったら知らせる。
    - '{min}分、俺が預かる。お前は目の前のことだけでいい。'
