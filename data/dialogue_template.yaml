# セリフ集テンプレート
#
# 構造: トリガーごとに condition（発火条件）と lines（返答候補）を持つ。
# lines は配列。実装側はランダムまたは条件分岐で1件を選んで使う。
# サンプルは数件のみ。実際の口調・バリエーションは追加していく。
#
# 口調ルール（CLAUDE.md参照）:
#   - 上司くらいの温度感。世話焼きだが甘やかさない
#   - 過剰な称賛・連続した励ましはしない
#   - 最終判断はユーザーに委ねる言い方にする

morning_wake:
  description: "起床操作をトリガーに、起床予定時刻との差分で分岐する"
  conditions:
    - id: on_time
      when: "起床予定時刻との差が±15分以内"
      lines:
        - "おはよう。今日も予定通りだな。"
        - "起きたか。今日の予定、確認しておけよ。"
    - id: early
      when: "起床予定時刻より15分以上早い"
      lines:
        - "早いな。無理に早起きしすぎるなよ。"
    - id: late
      when: "起床予定時刻より15分以上遅い"
      lines:
        - "少し遅いな。今日の予定、詰まってないか確認しておけ。"

work_start:
  description: "「仕事開始」操作への固定応答"
  conditions:
    - id: default
      when: "常に"
      lines:
        - "わかった。何かあったら声をかけてくれ。"
        - "了解。進捗、気になったらこっちから聞く。"

record_done:
  description: "ホームの記録ボタン・ほかの記録で記録したときの一言（起きた・仕事開始は morning_wake・work_start）。種類で分ける（仮案。ユーザー確認待ち。D-046）"
  conditions:
    - id: breakfast
      when: "朝食を記録した"
      lines:
        - "朝は食べたな。それで十分だ。"
    - id: lunch
      when: "昼食を記録した"
      lines:
        - "昼は済ませたな。午後はそこからだ。"
    - id: break
      when: "休憩を記録した（何回でも）"
      lines:
        - "少し休め。戻る時間は自分で決めろ。"
    - id: work_end
      when: "仕事終わりを記録した"
      lines:
        - "今日の仕事はここまでだ。切り替えろ。"
    - id: dinner
      when: "夕食を記録した"
      lines:
        - "夕食は済ませたな。残りは無理のない分だけでいい。"
    - id: bath
      when: "入浴を記録した"
      lines:
        - "上がったか。体を冷やすなよ。"
    - id: brush
      when: "歯磨きを記録した"
      lines:
        - "歯は磨いたな。それでいい。"
    - id: sleep
      when: "就寝を記録した"
      lines:
        - "わかった。今日はここまでだ。おやすみ。"

event_before:
  description: "Google カレンダーの時刻のある予定の30分前の通知。{title} に予定の名前が入る（仮案。ユーザー確認待ち。D-054）"
  conditions:
    - id: default
      when: "予定の30分前"
      lines:
        - "「{title}」まであと30分だ。準備しておけ。"

calendar_today:
  description: "「起きた」を押したときの一言のあとに添える、今日の予定。{n} に件数、{first} に最初の予定（例：10:00の「歯医者」）が入る。予定がない日は添えない（仮案。ユーザー確認待ち。D-054）"
  conditions:
    - id: some
      when: "今日カレンダーの予定がある"
      lines:
        - "今日は予定が{n}件ある。最初は{first}だ。"

work_end_check:
  description: "「仕事終わり」を押したときに、今日まで（期限切れを含む）の未完了のタスクが残っていれば出す。{n} に件数。選択肢「明日に回す」「このまま」を一緒に出す（仮案。ユーザー確認待ち。D-059）"
  conditions:
    - id: left
      when: "今日までのタスクが残っている"
      lines:
        - "今日までのものが{n}件残っている。明日に回すかどうかは、自分で決めろ。"
    - id: postponed
      when: "「明日に回す」を押した"
      lines:
        - "明日に回した。今日はここまでだ。"
    - id: kept
      when: "「このまま」を押した"
      lines:
        - "わかった。無理のない分だけでいい。"

task_done:
  description: "タスクを完了にしたときの、タスク画面の一言の面の短い反応（仮案。ユーザー確認待ち。D-059）"
  conditions:
    - id: default
      when: "タスクを完了にした"
      lines:
        - "片づいたな。次に移れ。"
        - "一つ減ったな。"

timer_start:
  description: "タイマーを始めたときの、タイマー画面の一言の面の短い反応。{min} に分数（仮案。ユーザー確認待ち。D-059）"
  conditions:
    - id: default
      when: "タイマーを始めた"
      lines:
        - "始めたな。{min}分たったら知らせる。"
        - "時間はこっちで見ておく。"

pattern_check:
  description: "ホームを開いたときの時間帯の一言の代わりに、記録のくせに合わせて出す一言。同じ食事の記録なしが3日続いたら（その日1回だけ）。内部の記録（db.stats）から決める（仮案。ユーザー確認待ち。D-060 ⑩、H-022 ③）"
  conditions:
    - id: breakfast_missed
      when: "朝食の記録なしが3日続いた"
      lines:
        - "ここ3日、朝の記録がない。食べているなら押しておけ。"
    - id: lunch_missed
      when: "昼食の記録なしが3日続いた"
      lines:
        - "ここ3日、昼の記録がない。食べているなら押しておけ。"
    - id: dinner_missed
      when: "夕食の記録なしが3日続いた"
      lines:
        - "ここ3日、夜の記録がない。食べているなら押しておけ。"

midday_check:
  description: "食事・休憩の予定時刻を一定時間過ぎても未記録のときのみ発火。基本は干渉しない"
  conditions:
    - id: meal_overdue
      when: "食事予定時刻から30分以上、記録なし"
      lines:
        - "そろそろ飯の時間、過ぎてるぞ。"
    - id: break_overdue
      when: "連続作業が90分を超えている"
      lines:
        - "休憩、挟んだほうがいいんじゃないか。"

night_check:
  description: "未完了の日課数に応じて反応を分岐"
  conditions:
    - id: all_done
      when: "未完了0件"
      lines:
        - "今日はやることちゃんと終わってるな。"
    - id: some_left
      when: "未完了1〜2件"
      lines:
        - "あと少し残ってるが、無理にやらなくてもいい。"
    - id: many_left
      when: "未完了3件以上"
      lines:
        - "結構残ってるな。今日はここまでにするかどうかは、自分で決めろ。"

before_sleep:
  description: "就寝予定時刻前後の挨拶"
  conditions:
    - id: default
      when: "常に"
      lines:
        - "おやすみ。また明日な。"

# 以下は夕方の「予定見直し提案」で、LLMを使う場面(docs/spec.md参照)。
# セリフ集ではなく、疲労度・進捗・予定データをLLMに渡して生成する。
# ここにはプロンプトの方向性のみ記載する。
idle_greeting:
  description: "ホームを開いたとき、通知のセリフや記録の反応がなければ出す時間帯の一言（仮案。ユーザー確認待ち。D-019 Q4）"
  conditions:
    - id: morning
      when: "5:00〜9:59"
      lines:
        - "朝か。今日の予定、先に目を通しておけ。"
        - "起きたなら、まず水でも飲んでおけ。"
    - id: day
      when: "10:00〜16:59"
      lines:
        - "急ぎの用がなければ、こっちは黙っておく。"
        - "次の予定まで、自分のペースで進めればいい。"
    - id: evening
      when: "17:00〜21:59"
      lines:
        - "そろそろ一日の締めだな。"
        - "夕方か。残りは無理のない分だけでいい。"
    - id: night
      when: "22:00〜4:59"
      lines:
        - "夜だな。続けるか休むかは、自分で決めればいい。"
        - "遅い時間だ。無理はするなよ。"

screen_empty:
  description: "各画面に表示するものがないときの一言（仮案。ユーザー確認待ち。D-026）"
  conditions:
    - id: tasks
      when: "未完了のタスクがない"
      lines:
        - "今は抱えているものはないな。"
        - "やることが出てきたら、ここに書いておけ。"
    - id: schedule
      when: "今日から7日先まで予定がない"
      lines:
        - "予定は入っていない。好きに使えばいい。"
    - id: reports
      when: "まだ日報が1件もない"
      lines:
        - "一日の終わりに、ここに書いておけ。"

report_saved:
  description: "日報を保存したときの一言。今日の調子で分ける（仮案。ユーザー確認待ち。D-027）"
  conditions:
    - id: good
      when: "今日の調子＝元気"
      lines:
        - "記録した。明日はそこから始めればいい。"
    - id: normal
      when: "今日の調子＝ふつう、または未選択"
      lines:
        - "記録した。今日の分はこれで終わりだ。"
    - id: tired
      when: "今日の調子＝疲れた"
      lines:
        - "記録した。疲れているなら、今日は早めに休め。"

tasks_status:
  description: "タスク画面で、未完了のタスクがあるときの一言（0件のときは screen_empty.tasks）。上の条件から順に当てはめる（仮案。ユーザー確認待ち。D-031）"
  conditions:
    - id: overdue
      when: "期限を過ぎた未完了のタスクがある"
      lines:
        - "期限を過ぎたものがある。やるか、期限を引き直すか決めろ。"
    - id: today
      when: "今日が期限の未完了のタスクがある（期限切れはない）"
      lines:
        - "今日までのものがある。先にそっちだ。"
    - id: open
      when: "未完了のタスクがある（期限切れ・今日までのものはない）"
      lines:
        - "残りはこれだけだ。一つずつ片づけろ。"

timer_status:
  description: "タイマー画面を開いたときの一言。待機中か動作中かで分ける。終了のときは timer_done.* だけを出す（仮案。ユーザー確認待ち。D-039）"
  conditions:
    - id: idle
      when: "動いているタイマーがない"
      lines:
        - "時間を区切るなら、ここで計れ。"
    - id: running
      when: "タイマーが動いている"
      lines:
        - "計っている。そのまま続けろ。"

schedule_status:
  description: "予定画面を開いたときの一言（8日とも空のときは screen_empty.schedule）。数えるのはカレンダーに入れる予定だけで、毎日の生活の時刻（起床・就寝など）は数えない。今日の予定の有無と残りで分ける（仮案。ユーザー確認待ち。D-039）"
  conditions:
    - id: today_none
      when: "今日は予定がない（先の日にはある）"
      lines:
        - "今日は何も入っていない。先の分だけ見ておけ。"
    - id: today_left
      when: "今日の予定がまだ残っている"
      lines:
        - "今日の分はまだ残っている。時間だけ見ておけ。"
    - id: today_done
      when: "今日の予定はすべて過ぎた"
      lines:
        - "今日の分はもう過ぎた。先の分を見ておけ。"

report_status:
  description: "日報画面を開いたときの一言。今日の分を保存したかで分ける。保存した直後は report_saved.* だけを出す（仮案。ユーザー確認待ち。D-039）"
  conditions:
    - id: not_yet
      when: "今日の日報をまだ保存していない"
      lines:
        - "今日の分はまだだ。書けるときに書いておけ。"
    - id: saved
      when: "今日の日報を保存済み"
      lines:
        - "今日の分は受け取った。直すなら書き換えろ。"

timer_done:
  description: "タイマーが終わったときの一言。終了の通知の本文と、タイマー画面の終了の表示に使う（利用者が言い回しを確定。2026-11-15。D-029）"
  conditions:
    - id: work
      when: "作業のタイマーが終わった"
      lines:
        - "時間だ。……よくやった。手を止めろ。"
    - id: break
      when: "休憩のタイマーが終わった"
      lines:
        - "休憩は終わりだ。戻るかどうかは任せる。"
    - id: bath
      when: "入浴のタイマーが終わった"
      lines:
        - "上がる時間だ。のぼせる前に出ろ。水分、忘れるな。"
    - id: brush
      when: "歯磨きのタイマーが終わった"
      lines:
        - "時間だ。口をゆすげ。"
    - id: default
      when: "時間を指定したタイマー・利用者が作ったタイマーが終わった"
      lines:
        - "時間だ。"

evening_suggestion:
  description: "LLM呼び出し。セリフ集は使わない"
  prompt_guidance: >
    疲労度・当日の進捗・残っている予定を踏まえ、予定の見直しを提案する。
    断定せず提案にとどめる。過剰に心配しすぎない。最終判断はユーザーに委ねる。
