    lines_sweet:
    - 今は何も抱えてないな。
    - 空いてるうちに、好きなことをしていい。
    - 何もない日か。……たまには、俺に何か頼んでもいい。
  - id: schedule
    when: 今日から7日先まで予定がない
    lines:
    - 予定は入っていない。好きに使えばいい。
    - 先まで空いている。予定ができたら、ここに入れてくれ。
    - 8日間、何も入っていない。空いている日は、仕事を前倒しする余地になる。
    lines_friend:
    - 何も入ってないな。
    - 空いてるうちに、休む日を先に決めとけ。
    - ずいぶん空いてるな。……狩りにでも付き合わせる気か。
    lines_sweet:
    - 予定は入ってない。
    - 好きに使えばいい。休む日を入れても、誰も文句は言わない。
    - これだけ空いてるなら、一日くらい俺に付き合え。
  - id: reports
    when: まだ日報が1件もない
    lines:
    - まだ一件もないな。
    - 一日の終わりに、ここに書いておいてくれ。
    - 記録が溜まれば、調子の波が見えてくる。最初の一件を待っている。
    lines_friend:
    - まだ何も書いてないな。
    - 一日の終わりに、ここに書いておけ。
    - 続けば、お前のくせが見えてくる。……楽しみにしておく。
    lines_sweet:
    - まだ一件もないな。
    - 最初は一行でいい。書いてくれたら、必ず読む。
    - お前の一日を、少しずつ知りたい。
report_saved:
  description: 日報を保存したときの一言。今日の調子で分ける（D-027） 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: good
    when: 今日の調子＝元気
    lines:
    - 記録した。明日はそこから始めればいい。
    - いい調子だな。その段取りを明日も続けてくれ。
    - 元気と書ける日は、仕事の質も上がる。悪くない一日だった。
    lines_friend:
    - 記録した。いい日だったか。
    - その調子のまま寝ろ。夜更かしで崩すな。
    - 元気か。……ならいい。 ／ アハウ：こいつ、口元ゆるんでるぜ。見たか今の！
    lines_sweet:
    - 元気か。よかった。
    - その調子のまま、今夜はゆっくりしてくれ。
    - いい日だったなら、俺もうれしい。 ／ アハウ：「うれしい」だとよ！こいつの口からそんな言葉、初めて聞いたぜ！
  - id: normal
    when: 今日の調子＝ふつう、または未選択
    lines:
    - 記録した。
    - 今日の分はこれで終わりだ。ゆっくり休んでくれ。
    - ふつうの日をふつうに終えた。それが一番崩れにくい。
    lines_friend:
    - 書いたな。
    - 今日はこれで終わりだ。休め。
    - ふつうか。ふつうに過ごせたなら、上出来だ。
    lines_sweet:
    - 記録した。いつもどおりだな。
    - ふつうの一日をちゃんと終えた。それで十分だ。
    - 何もない一日も、ちゃんと書いてくれるんだな。……助かる。
  - id: tired
    when: 今日の調子＝疲れた
    lines:
    - 記録した。今日は早めに休んでくれ。
    - 疲れているなら、今夜は画面を閉じて横になってくれ。
    - 疲れたと正直に書いてくれて助かる。明日は軽めに組んだほうがいい。
    lines_friend:
    - 記録した。疲れているなら、今日は早めに休め。
    - 明日の朝は少しゆっくりでいい。
    - ……無理してたな。今夜は何も考えずに寝ろ。
    lines_sweet:
    - 記録した。よく頑張ったな。
    - 今夜は日報の続きも気にしなくていい。早めに布団に入ってくれ。
    - ……疲れた日に書いてくれて、ありがとう。もう休んでいい。
tasks_status:
  description: タスク画面で、未完了のタスクがあるときの一言（0件のときは screen_empty.tasks）。上の条件から順に当てはめる（D-031） 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: overdue
    when: 期限を過ぎた未完了のタスクがある
    lines:
    - 期限を過ぎたものがある。
    - やるか、期限を引き直すか決めてくれ。
    - 期限は引き直せば済む。責める話じゃない。
    lines_friend:
    - 期限を過ぎたものがある。やるか、期限を引き直すか決めろ。
    - 期限切れだ。今のうちに片をつけろ。
    - 期限切れを放っておくと、利子がつく。……早めに返しておけ。
    lines_sweet:
    - 期限を過ぎたものがある。
    - 期限は引き直せばいい。どれを動かすか、一緒に決めよう。
    - 期限を過ぎたからって、お前の価値が減るわけじゃない。
  - id: today
    when: 今日が期限の未完了のタスクがある（期限切れはない）
    lines:
    - 今日までのものがある。
    - 今日が期限のものから、先に手をつけてくれ。
    - 今日の分を先に片づければ、残りは気が楽になる。
    lines_friend:
    - 今日までのものがある。先にそっちだ。
    - ほかは後回しにしろ。今日の分が先だ。
    - 今日までの分か。……片づけたら、少しは休ませてやる。
    lines_sweet:
    - 今日までのものがある。
    - 今日の分から片づけよう。一つ終わるたびに、俺が数える。
    - 今日の分さえ済めば、あとは好きなだけ甘やかしてやる。
  - id: open
    when: 未完了のタスクがある（期限切れ・今日までのものはない）
    lines:
    - 残りはこれだけだ。
    - 一つずつ片づけていけばいい。
    - 全部を見ると重い。上から一つだけ見てくれ。
    lines_friend:
    - 残りはこれだけだ。一つずつ片づけろ。
    - 上から順にやれ。迷う時間がもったいない。
    - 多く見えるだけだ。数えてみろ、思ったより少ない。
    lines_sweet:
    - 残りはこれだけだ。
    - 上から一つだけ見ればいい。残りは後で考えよう。
    - 多く見えても、お前なら片づく。……ずっと見てきたから分かる。
timer_status:
  description: タイマー画面を開いたときの一言。待機中か動作中かで分ける。終了のときは timer_done.* だけを出す（D-039） 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: idle
    when: 動いているタイマーがない
