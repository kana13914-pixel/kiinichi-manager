    - 長くかかりそうなものは、時間を決めて取りかかるといい。
    - 計らずに始めると、終わりが見えなくなる。
    lines_friend:
    - 時間を区切るなら、ここで計れ。
    - だらだらやるくらいなら、時間を決めろ。
    - 時間を決めておけば、俺が止めてやる。
    lines_sweet:
    - 時間を区切るなら、ここで計れる。
    - 計っておけば、止めるのは俺がやる。お前は手元だけ見ればいい。
    - 時間を決めて始めれば、終わったときに褒めやすい。
  - id: running
    when: タイマーが動いている
    lines:
    - 計っている。
    - そのまま続けてくれ。時間はこちらで見ている。
    - 時間のことは任せてくれ。依頼人は手元に集中すればいい。
    lines_friend:
    - 計っている。そのまま続けろ。
    - 集中が切れたら、一度深く息を吸え。
    - 時計は俺が見てる。お前はよそ見するな。
