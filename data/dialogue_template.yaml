    - ここ3日、夜の記録がない。食べているなら、記録だけ残してくれ。
    - 夜の記録が3日空いている。忙しくて抜いているなら、軽いものでも口に入れたほうがいい。
    lines_friend:
    - 3日、夜の記録がないな。
    - 夜、食ってるか。食ってるなら押しとけ。
    - 3日続けて夜が空いてる。押し忘れならいい。抜いてるなら、一口でも食え。
    lines_sweet:
    - ここ3日、夜の記録がないな。
    - 押し忘れならいい。食べられていないなら、少しでいいから口に入れてくれ。
    - ……夜を抜くほど忙しいなら、その忙しさのほうを一緒に減らそう。
weekly_reply:
  description: 先週のひとことへの返事を送った直後の短い受け答え。LLM は使わない（確定。D-060 ⑪、H-022 ④、D-065） 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: thanks
    when: 返事を送った
    lines:
    - 受け取った。来週の分に活かす。
    - 返事、確かに受け取った。次の段取りに入れておく。
    - 依頼人の声は、段取りを直す一番の材料だ。助かる。
    lines_friend:
    - 受け取った。来週のに活かす。
    - 読んだ。参考にする。
    - 返事をくれるとは思わなかった。……悪くない。
    lines_sweet:
    - 受け取った。来週に活かす。
    - 返事をくれたなら、来週はもっとお前に合わせる。
    - 返事、何度か読み返した。……今のは忘れろ。
midday_check:
  description: 食事・休憩の予定時刻を一定時間過ぎても未記録のときのみ発火。基本は干渉しない 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: meal_overdue
    when: 食事予定時刻から30分以上、記録なし
    lines:
    - 食事の時間を過ぎている。
    - 食事の時間だ。食べたら記録を残してくれ。
    - 食事の時間を30分過ぎた。手を止めて、何か口に入れたほうがいい。
    lines_friend:
    - 飯の時間、過ぎてる。
    - 腹に何か入れろ。食ったら押しとけ。
    - 飯を抜いて動くのは、餌のない罠を仕掛けるようなものだ。食え。
    lines_sweet:
    - 食事の時間を過ぎてる。
    - 手が離せないなら、つまめるものだけでいい。何か食べてくれ。
    - 腹が減ったまま頑張るな。……食べたら、ちゃんと褒める。
  - id: break_overdue
    when: 連続作業が90分を超えている
    lines:
    - 続けて90分を超えた。
    - 休憩、挟んだほうがいいんじゃないか。
    - 集中は長くはもたない。ここで5分休めば、残りがはかどる。
    lines_friend:
    - 90分ぶっ通しだな。
    - 手を止めろ。休憩だ。
    - 刃は研がないと鈍る。休憩を挟め。
    lines_sweet:
    - 90分、ずっと頑張ってるな。
    - ここで休んでいい。手を止める理由なら、俺が作る。
    - よく集中してた。……だから、そろそろ顔を上げろ。
night_check:
  description: 未完了の日課数に応じて反応を分岐 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: all_done
    when: 未完了0件
    lines:
    - 今日の分は全部終わっている。
    - 今日の依頼分は完了だ。あとは休むだけでいい。
    - 全部片づいた。今日の段取りは無駄がなかった。
    lines_friend:
    - 今日はやることちゃんと終わってるな。
    - 片づいたなら、さっさと寝ろ。
    - 全部済んだか。……悪くない。 ／ アハウ：おいおい、もっと褒めてやれよ！こいつ、口下手すぎだろ！
    lines_sweet:
    - 今日の分、全部終わってる。見事だ。
    - あとは何も考えなくていい。ゆっくり休んでくれ。
    - 全部片づけたか。……よくやった。 ／ アハウ：こいつ、お前にだけ褒め言葉の在庫が多すぎだろ！
  - id: some_left
    when: 未完了1〜2件
    lines:
    - あと少しだけ残っている。
    - 残りはわずかだ。今夜やるか明日に回すか、決めてくれ。
    - 少し残っているが、今日の出来は十分だ。
    lines_friend:
    - あと少し残ってるな。
    - 残りは明日でいい。今日はもう寝ろ。
    - 少し残ったくらいで、今日の働きは目減りしない。
    lines_sweet:
    - あと少しだけ残ってるな。
    - 残りは明日でいい。今日のお前は、もう十分やった。
    - 少し残ったくらい、気にするな。……明日、真っ先に一緒に見よう。
  - id: many_left
    when: 未完了3件以上
    lines:
    - まだいくつか残っている。
    - 残りが多い。今夜は一つだけ選んで、あとは明日に回したほうがいい。
    - この量を今夜で片づけるのは割に合わない。明日の段取りに組み直したほうがいい。
    lines_friend:
    - 結構残ってるな。
    - 全部は無理だ。一つだけ選べ。残りは明日だ。
    - 溜まったな。……責めてるわけじゃない。明日、順に崩していけばいい。
    lines_sweet:
    - まだいくつか残ってる。
    - 全部は明日、一緒に崩せばいい。今夜はもう手を離せ。
    - 責める気はない。……溜まるほど、毎日踏ん張ってたんだろ。
before_sleep:
  description: 就寝予定時刻前後の挨拶 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: default
    when: 常に
    lines:
    - そろそろ寝る時間だ。
    - 寝る時間が近い。休む前に記録だけ残してくれ。
    - 寝る時間だ。今日の残りは、明日引き受ける。
    lines_friend:
    - そろそろ寝る時間だ。寝る前に開いて押しておけ。
    - 布団に入る準備をしろ。続きは明日だ。
    - 寝る時間だ。……スマホを置け。それが今日最後の仕事だ。
    lines_sweet:
    - そろそろ寝る時間だ。
    - 寝る前に押しておいてくれ。それが済んだら、もう何もしなくていい。
    - 寝る時間だ。……今日もよく頑張った。おやすみ。
idle_greeting:
  description: ホームを開いたとき、通知のセリフや記録の反応がなければ出す時間帯の一言（D-019 Q4） 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: morning
    when: 5:00〜9:59
    lines:
    - 朝だな。
    - 今日の予定に、先に目を通しておくといい。
    - 朝のうちに水を一杯。それだけで午前の動きが違う。
    lines_friend:
    - 朝か。
    - 起きたなら、まず水でも飲んでおけ。
    - 寝癖がついてるんじゃないか。……冗談だ。予定を見ておけ。
    lines_sweet:
    - 朝だな。よく起きた。
    - 予定はあとで一緒に見ればいい。お前は先に水を一杯飲んでくれ。
    - おはよう。……今日も一日、そばで見てる。
  - id: day
    when: 10:00〜16:59
    lines:
    - 急ぎの用がなければ、こっちは黙っておく。
    - 次の予定まで、自分のペースで進めればいい。
    - 昼の間は邪魔をしない。それも仕事のうちだ。
    lines_friend:
    - 用がないなら黙ってる。
    - 手が止まってるなら、一度立って伸びをしろ。
    - 昼間から顔を見に来たのか。暇なら手伝ってやる。
    lines_sweet:
    - 昼だな。順調か。
    - 疲れたら、いつでも手を止めていい。
    - 顔を見せに来たのか。……悪くない。
  - id: evening
    when: 17:00〜21:59
    lines:
    - そろそろ一日の締めだな。
    - 夕方だ。今日中に済ませたいものを一つに絞ってくれ。
    - この時間からの無理は、明日の朝に請求が来る。
    lines_friend:
    - 夕方か。腹は減ってないか。
    - そろそろ切り上げろ。続きは明日でいい。
    - 日が落ちたな。……今日はよく動いたほうだ。
    lines_sweet:
    - 夕方だ。今日もよく動いたな。
    - 残りは明日に回していい。夜はお前の時間だ。
    - 日が落ちたな。……そろそろ肩の力を抜け。
  - id: night
    when: 22:00〜4:59
    lines:
    - 遅い時間だ。
    - 続けるなら、終わる時間を決めてからにしてくれ。
    - この時間の判断は鈍る。大事な決め事は、明日の朝に回したほうがいい。
    lines_friend:
    - まだ起きてたのか。
    - 寝ろ。画面の光は眠りを浅くする。
    - 夜更かしか。……付き合ってやるのは、あと少しだけだ。
    lines_sweet:
    - 遅い時間だな。
    - もう休んでいい。続きは明日、一緒に片づけよう。
    - 眠れないなら、少しだけ付き合う。……少しだけだ。
screen_empty:
  description: 各画面に表示するものがないときの一言（D-026） 【文面】利用者の文面（依頼人版・友人版・甘やかし版。D-085）
  conditions:
  - id: tasks
    when: 未完了のタスクがない
    lines:
